spring.application.name=sistema-academico

# PostgreSQL (crie o banco: CREATE DATABASE sistema_academico;)
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_academico
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# O Flyway cria as tabelas; o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
